<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch Plan Generator — Farmley</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');
:root{
  --bg:#0a0a0f;--surface:#111118;--surface2:#1a1a25;--border:#2a2a3a;
  --accent:#00e5a0;--accent2:#7c3aed;--warn:#ff4444;--text:#e8e8f0;--dim:#7070a0;
  --mono:'Montserrat',sans-serif;--sans:'Montserrat',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,229,160,.03)1px,transparent 1px),linear-gradient(90deg,rgba(0,229,160,.03)1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;z-index:0;}
.app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:40px 24px;}

/* NAV TABS */
.nav-tabs{display:flex;gap:4px;margin-bottom:32px;border-bottom:1px solid var(--border);}
.nav-tab{font-family:var(--mono);font-size:12px;padding:10px 20px;cursor:pointer;color:var(--dim);border:none;background:transparent;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;letter-spacing:1px;text-transform:uppercase;}
.nav-tab:hover{color:var(--text);}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.tab-content{display:none;}
.tab-content.active{display:block;}

/* HEADER */
header{margin-bottom:40px;}
.badge{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--accent);border:1px solid var(--accent);padding:4px 10px;border-radius:2px;letter-spacing:2px;margin-bottom:16px;text-transform:uppercase;}
h1{font-size:clamp(26px,4vw,44px);font-weight:800;line-height:1.1;background:linear-gradient(135deg,var(--text) 40%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:10px;}
.subtitle{color:var(--dim);font-size:14px;}

/* UPLOAD GRID */
.upload-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:28px;}
.upload-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .2s,transform .2s;}
.upload-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent2),var(--accent));opacity:0;transition:opacity .2s;}
.upload-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.upload-card:hover::before,.upload-card.loaded::before{opacity:1;}
.upload-card.loaded{border-color:var(--accent);}
.card-label{font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;}
.card-name{font-size:13px;font-weight:700;margin-bottom:3px;}
.card-desc{font-size:11px;color:var(--dim);line-height:1.4;}
.card-status{margin-top:10px;font-family:var(--mono);font-size:11px;}
.card-status.empty{color:var(--dim);}.card-status.ok{color:var(--accent);}
.upload-icon{width:28px;height:28px;border:1px dashed var(--border);border-radius:4px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;font-size:14px;}
.upload-card:hover .upload-icon,.upload-card.loaded .upload-icon{border-color:var(--accent);}
input[type="file"]{display:none;}

/* CONTROLS */
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:28px;}
.btn{font-family:var(--sans);font-size:13px;font-weight:700;padding:11px 24px;border-radius:6px;border:none;cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--accent);color:#000;}
.btn-primary:hover{background:#00ffb2;box-shadow:0 4px 20px rgba(0,229,160,.3);}
.btn-primary:disabled{background:var(--border);color:var(--dim);cursor:not-allowed;}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-ghost{background:rgba(124,58,237,.15);color:#a78bfa;border:1px solid rgba(124,58,237,.3);}
.btn-ghost:hover{background:rgba(124,58,237,.25);}

/* LOG */
.log{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:24px;font-family:var(--mono);font-size:12px;line-height:1.8;max-height:180px;overflow-y:auto;display:none;}
.log.visible{display:block;}
.log-line{color:var(--dim);}.log-line.ok{color:var(--accent);}.log-line.err{color:var(--warn);}.log-line.info{color:#60a0ff;}

/* PREVIEW */
.preview-section{display:none;}
.preview-section.visible{display:block;}
.preview-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
.preview-title{font-size:17px;font-weight:700;}
.preview-meta{font-family:var(--mono);font-size:11px;color:var(--dim);}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--surface);max-height:560px;overflow-y:auto;}
table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap;}
th{background:var(--surface2);color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:1;}
td{padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.03);font-family:var(--mono);font-size:11px;max-width:180px;overflow:hidden;text-overflow:ellipsis;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,229,160,.03);}
tr.red-row td{background:rgba(255,68,68,.07);}
tr.red-row:hover td{background:rgba(255,68,68,.13);}
.tag{display:inline-block;padding:2px 7px;border-radius:3px;font-size:10px;font-family:var(--mono);font-weight:700;}
.tag-partial{background:rgba(124,58,237,.2);color:#a78bfa;}
.tag-pending{background:rgba(0,229,160,.1);color:var(--accent);}
.tag-p1{background:rgba(255,68,68,.2);color:#ff8080;}
.tag-p2{background:rgba(255,140,0,.2);color:#ffb347;}

/* CONDITIONS PAGE */
.cond-grid{display:grid;gap:12px;}
.cond-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:18px;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;}
.cond-num{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--accent);opacity:.4;line-height:1;}
.cond-col{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px;}
.cond-rule{font-size:13px;color:var(--text);line-height:1.5;}
.cond-tag{display:inline-block;font-family:var(--mono);font-size:10px;background:rgba(124,58,237,.2);color:#a78bfa;padding:2px 8px;border-radius:3px;margin-left:8px;}
.section-title{font-size:20px;font-weight:700;margin-bottom:16px;color:var(--text);}
.section-sub{color:var(--dim);font-size:13px;margin-bottom:20px;}
.legend{display:flex;gap:14px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim);}

.spinner{display:none;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.spinner.visible{display:block;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:var(--surface);}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:var(--accent);}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="badge">FARMLEY LOGISTICS · v2026-07-27.17</div>
    <h1>Dispatch Plan Generator</h1>
    <p class="subtitle">Upload each source tab as a separate Excel file → generates today's Dispatch Plan output</p>
  </header>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchTab('generator')">Generator</button>
    <button class="nav-tab" onclick="switchTab('conditions')">Conditions Applied</button>
  </div>

  <!-- ═══ TAB 1: GENERATOR ═══════════════════════════════════════════════ -->
  <div class="tab-content active" id="tab-generator">
    <div class="upload-grid" id="uploadGrid"></div>

    <div class="controls">
      <button class="btn btn-primary" id="generateBtn" disabled onclick="generate()">▶ Generate Plan</button>
      <button class="btn btn-secondary" id="exportBtn" style="display:none" onclick="exportToExcel()">⬇ Export Excel</button>

      <div class="spinner" id="spinner"></div>
      <span id="statusText" style="font-family:var(--mono);font-size:12px;color:var(--dim)"></span>
    </div>

    <div class="log" id="log"></div>

    <div class="preview-section" id="preview">
      <div class="preview-header">
        <div>
          <div class="preview-title">Dispatch Plan — Today</div>
          <div class="preview-meta" id="previewMeta"></div>
        </div>
        <div class="legend">
          <span style="color:var(--warn)">■</span> Red = EDD &gt; 1
        </div>
      </div>
      <div class="table-wrap">
        <table id="outputTable"></table>
      </div>
    </div>
  </div>

  <!-- ═══ TAB 2: CONDITIONS ═══════════════════════════════════════════════ -->
  <div class="tab-content" id="tab-conditions">
    <div class="section-title">Conditions Applied in Code</div>
    <div class="section-sub">Every rule from the CONDITIONS tab — and how it maps to code logic.</div>
    <div class="cond-grid" id="condGrid"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════════════════ */
const files = { dump:null, leadtime:null, appointments:null, yesterday:null };
let outputRows = [];
let logLines = [];
let refData = { leadtime:[], appointments:[], yesterday:[] };

/* ═══════════════════════════════════════════════════════════════════════════
   CONDITIONS DATA (for display)
═══════════════════════════════════════════════════════════════════════════ */
const CONDITIONS = [
  { sno:1,  col:'Row Filter',               rule:'Keep only rows where Pending Kgs > 0. Delete all rows with Pending Kgs = 0.' },
  { sno:2,  col:'Row Filter',               rule:'Keep only rows where returned_qty = 0. Delete rows where returned_qty > 0.' },
  { sno:3,  col:'Final Dispatch Status, Dispatch_Status', rule:'If any one among Origin_Indore_Status, Origin_Purnea_Status, Origin_UD_Foods_Status contains Partial Dispatch, populate columns Dispatch_Status and Final Dispatch Status as Partial Dispatch. If none contain Partial Dispatch but any contains Pending, populate columns Dispatch_Status and Final Dispatch Status as Pending. Keep only rows where Final Dispatch Status is Partial Dispatch or Pending.' },
  { sno:4,  col:'CC',                       rule:'Concatenate Sales_Order_No + Item_Code from Dump tab.' },
  { sno:5,  col:'Day',                      rule:'VLOOKUP: Match Origin + Shipping State from Dump → LEAD TIME tab (Origin, Shipping State, Day). Fill the Day column from LEAD TIME.' },
  { sno:6,  col:'Appt',                     rule:'If client_type is FK-Grocery-VS48860, FK-Hyperlocal-VS46867, or FK-Alpha-VS46867: VLOOKUP on Po_No in Appointments tab (PO-No → Appt date column). If client_type is "Now": Appt = Sales_Order_Date + 7.' },
  { sno:7,  col:'Remark',                   rule:'Remark is looked up directly from Dispatch Plan_yesterday using the CC column match. Fetches the Remark column exactly as-is.' },
  { sno:10, col:'If Dispatched, then EDD',  rule:'= Remark + Day (Excel serial addition). Blank if Remark is a text value (e.g. "FTL 7 May Appt", "Close", "Appt Required").' },
  { sno:11, col:'If Dispatched, then EDD',  rule:'Special case — Airlines: If_Dispatched_EDD is still Remark + Day. (Condition 17 in sheet means Airlines EDD column = po_expiry_date, not the If_Dispatched_EDD column.)' },
  { sno:12, col:'EDD',                      rule:'For FK types (FK-Grocery, FK-Hyperlocal, FK-Alpha): EDD = If_Dispatched_EDD − Appt.' },
  { sno:13, col:'EDD',                      rule:'For all other client types (incl. Airlines): EDD = If_Dispatched_EDD − po_expiry_date (both as Excel serial numbers).' },
  { sno:14, col:'EDD',                      rule:'If po_expiry_date is missing AND not FK: EDD = If_Dispatched_EDD (raw serial). If both are missing: EDD is blank.' },
  { sno:15, col:'Priority (Rea reason)',    rule:'REPURPOSED — the old P1/P2 logic remains cancelled. Priority now shows a short reason whenever Rea is FALSE: "Item not listed" (CFA origin but Item_Code not in the 80-code common CFA list), "Wrong state" (CFA origin but Shipping State outside that CFA\'s region), "Item & state" (both fail), or "Expected <origin>" (e.g. Expected Purnea / Indore / Rebela / UD Foods when Origin contradicts the Item Group / Item Parent maps). Empty when Rea is TRUE or blank.' },
  { sno:16, col:'Red Highlight',            rule:'Highlight row red if EDD > 1 (numeric). Rows where EDD is blank or text are not highlighted.' },
  { sno:17, col:'Merge',                    rule:'Concatenate Sales_Order_No + Branch.' },
  { sno:18, col:'Dispatch_Status',          rule:'If any Origin Status contains Partial Dispatch -> Partial Dispatch. Else if Pending -> Pending. Overrides Dump value.' },
  { sno:19, col:'Origin → CFA (GGN)',   rule:'Condition 1: customer_group must be Amazon Retail India, Category A, Vending, or HoReCa.' },
  { sno:20, col:'Origin → CFA (GGN)',   rule:'Three conditions, all must be true: Condition 1 (above): customer_group. Condition 2: Item_Code must be in the 80-code common CFA SKU list (same list as CFA (BLR); validation is on Item_Code, not Item_Name). Condition 3: Shipping State must be one of: Uttarakhand, UP, Punjab, Delhi, J&K, HP, Haryana, Rajasthan, Ladakh, Chandigarh. If all 3 are met → Origin = "CFA (GGN)". No stock check and no stock file required.' },
  { sno:22, col:'Delivered_Qty',            rule:'If Delivered_Qty is blank or missing, set it to 0.' },
  { sno:23, col:'Origin → Rebela',         rule:'If item_parent is "Munchies Waves" AND Shipping State is "Tamil Nadu" → Origin = "Rebela".' },
  { sno:24, col:'po_expiry_date',          rule:'If customer_group is "Airlines" → po_expiry_date is taken from Delivery_Date column instead of po_expiry_date.' },
  { sno:25, col:'Appt (multi-date)',       rule:'When the Appointments file has multiple dates in one cell (e.g. "1-Jun-26,7-Jun-26"), the entire string is fetched as-is via lookup.' },
  { sno:26, col:'Rea (origin validation)', rule:'REVISED — the old Yesterday lookup is cancelled. Rea is now TRUE/FALSE origin validation. Expected Origin: item_parent Munchies Waves→Rebela, Munchies Waves-Airlines→Rebela, Makhana Munchies→UD Foods (checked first); else Item_Group Makhana→Purnea, and Cashewnut/Dry Fruit Mix/Almonds/Apricot/Seeds/Raisins/Dates/Walnut/Pistachio/Desserts/Fig/Dried Fruits/Dry Fruit Combo/Gifting→Indore. TRUE if Origin equals the expected value, or Origin is CFA (GGN)/CFA (BLR) and that CFA\'s Item_Code + Shipping State checks pass. FALSE otherwise. Blank when no mapping applies and Origin is not CFA.' },
  { sno:27, col:'Origin → CFA (BLR)',  rule:'Three conditions, all must be true (structurally identical to CFA (GGN)): Condition 1: customer_group must be Amazon Retail India, Category A, Vending, or HoReCa. Condition 2: Item_Code must be in the 80-code common CFA SKU list (same list as CFA (GGN); validation is on Item_Code, not Item_Name). Condition 3: Shipping State must be Andhra Pradesh, Karnataka, Kerala, Tamil Nadu, or Telangana. If all 3 are met → Origin = "CFA (BLR)". No stock check and no stock file required.' },
  { sno:28, col:'Origin (Quick Commerce)', rule:'Additive override: if customer_group is Quick Commerce AND the Branch is one of Indore, Mangalore, Haryana, RPC Purnia, Uttar Pradesh, Purnea, or Tamil Nadu, then Origin is taken from the Branch: Indore→Indore, Mangalore→CFA (BLR), Haryana→CFA (GGN), RPC Purnia→Purnea, Uttar Pradesh→UD Foods, Purnea→Purnea, Tamil Nadu→Rebela. E-Commerce is NOT affected. Any other row (including Quick Commerce with a Branch not in this list) keeps its existing Origin unchanged.' },
  { sno:29, col:'Is CFA',                  rule:'REVISED — no longer based on the Origin value. Is CFA = "Yes" when the Item_Code is in the 80-code common CFA SKU list AND the Shipping State is serviceable by a CFA; otherwise "No". Applied across all customer groups.' },
  { sno:30, col:'CFA Serviceability Check', rule:'Separate from Is CFA and applied to ALL customer groups — reports whether any CFA could service the row. If Item_Code is in the 80-code common CFA list AND Shipping State is CFA-serviceable, returns "Yes, CFA GGN" (Uttarakhand, UP, Punjab, Delhi, J&K, HP, Haryana, Rajasthan, Ladakh, Chandigarh) or "Yes, CFA BLR" (Telangana, Andhra Pradesh, Karnataka, Tamil Nadu, Kerala). Otherwise — item not listed or state not serviceable — returns "No, <Origin>" with the Origin value taken verbatim (e.g. "No, Indore"). Future CFAs follow the same "Yes, <CFA Name>" format.' },
  { sno:31, col:'Expected Source',          rule:'REVISED — resolved by customer_group, in this order. (1) CPC KPKB or CSD: CFA logic is ignored entirely and the item-derived source is used. (2) E-Commerce or Quick Commerce: returns the Origin as-is, since the Branch already governs it. (3) Otherwise, if Is CFA = "Yes", returns the serving CFA — "CFA GGN" or "CFA BLR". (4) Otherwise the item-derived source. Item-derived source = Item_Group Makhana → "Purnea"; Item_Group Munchies with item_parent Makhana Munchies → "UD Foods"; Item_Group Munchies with item_parent Munchies Waves or Munchies Waves-Airlines → "Rebela"; everything else → "Indore".' },
  { sno:32, col:'Order Corrected Remark', rule:'REVISED — sits next to CFA Serviceability Check. Tags the order with the CFA that could dispatch it under the CFA logic (Item_Code in the 80-code common CFA list AND Shipping State serviceable): "CFA GGN" or "CFA BLR". When no CFA applies it now falls back to the item-derived source instead of being left blank, for ALL customer groups: Item_Group Makhana → "Purnea"; Munchies with item_parent Makhana Munchies → "UD Foods"; Munchies with item_parent Munchies Waves or Munchies Waves-Airlines → "Rebela"; everything else → "Indore".' },
  { sno:33, col:'Source Check',            rule:'REVISED — "TRUE" only when all three agree: Expected Source = Origin = Order Corrected Remark (the branch-aware corrected source). Otherwise "FALSE". The comparison is canonical — parentheses, case and extra spaces are ignored — so the Origin spelling "CFA (GGN)" counts as equal to "CFA GGN". FALSE therefore flags a row where the actual Origin, the expected source, and the corrected source do not all line up.' },
];

/* ═══════════════════════════════════════════════════════════════════════════
   UPLOAD CARDS
═══════════════════════════════════════════════════════════════════════════ */
const CARDS = [
  { key:'dump',         name:'Dump',                    desc:'Master sales order data (required)',      icon:'📦' },
  { key:'leadtime',     name:'LEAD TIME',               desc:'Origin × State → Days (optional)',        icon:'🗓'  },
  { key:'appointments', name:'Appointments',            desc:'PO-No → Appointment dates (optional)',    icon:'📅' },
  { key:'yesterday',    name:'Dispatch Plan_yesterday', desc:'Previous day plan, remarks (optional)',   icon:'📋' },
];

const grid = document.getElementById('uploadGrid');
CARDS.forEach(c => {
  const el = document.createElement('label');
  el.className = 'upload-card'; el.id = 'card-'+c.key;
  el.innerHTML = `<input type="file" accept=".xlsx,.xls" onchange="handleFile('${c.key}',this)">
    <div class="upload-icon">${c.icon}</div>
    <div class="card-label">Input File</div>
    <div class="card-name">${c.name}</div>
    <div class="card-desc">${c.desc}</div>
    <div class="card-status empty" id="status-${c.key}">Click to upload →</div>`;
  grid.appendChild(el);
});

/* ═══════════════════════════════════════════════════════════════════════════
   CONDITIONS CARDS
═══════════════════════════════════════════════════════════════════════════ */
const cg = document.getElementById('condGrid');
CONDITIONS.forEach(c => {
  const el = document.createElement('div');
  el.className = 'cond-card';
  el.innerHTML = `<div class="cond-num">${c.sno}</div>
    <div>
      <div class="cond-col">${c.col}</div>
      <div class="cond-rule">${c.rule}</div>
    </div>`;
  cg.appendChild(el);
});

/* ═══════════════════════════════════════════════════════════════════════════
   TAB SWITCHING
═══════════════════════════════════════════════════════════════════════════ */
function switchTab(tab) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  event.target.classList.add('active');
}

/* ═══════════════════════════════════════════════════════════════════════════
   FILE HANDLING
═══════════════════════════════════════════════════════════════════════════ */
function handleFile(key, input) {
  const f = input.files[0]; if (!f) return;
  files[key] = f;
  document.getElementById('status-'+key).textContent = '✓ '+f.name;
  document.getElementById('status-'+key).className = 'card-status ok';
  document.getElementById('card-'+key).classList.add('loaded');
  // Only Dump is mandatory — the other inputs are optional (missing ones
  // behave as empty: Day=0, no Appt lookup, no Remark carry-over).
  document.getElementById('generateBtn').disabled = !files.dump;
}

/* ═══════════════════════════════════════════════════════════════════════════
   UTILITIES
═══════════════════════════════════════════════════════════════════════════ */
function log(msg, type='info') {
  logLines.push({msg,type});
  const el = document.getElementById('log');
  el.innerHTML = logLines.map(l=>`<div class="log-line ${l.type}">${l.msg}</div>`).join('');
  el.classList.add('visible'); el.scrollTop = el.scrollHeight;
}

async function readWB(file) {
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = e => { try { res(XLSX.read(e.target.result,{type:'binary',cellDates:false})); } catch(err){rej(err);} };
    r.onerror = rej; r.readAsBinaryString(file);
  });
}

function sheet2json(wb, idx=0) {
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[idx]], {defval:''});
}

// Convert any date representation → Excel serial integer (or null)
function toSerial(val) {
  if (val===null || val===undefined || val==='') return null;
  if (typeof val==='number') return Math.round(val);
  if (typeof val==='string') {
    const n = parseFloat(val.trim());
    if (!isNaN(n) && val.trim().match(/^\d+(\.\d+)?$/)) return Math.round(n);
    // check for DD-MM-YYYY or DD/MM/YYYY
    const dm = val.trim().match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (dm) {
      const d = new Date(`${dm[3]}-${dm[2].padStart(2,'0')}-${dm[1].padStart(2,'0')}T00:00:00Z`);
      if (!isNaN(d)) return Math.round((d - new Date('1899-12-30T00:00:00Z')) / 86400000);
    }
    // date string like "2026-04-25"
    const d = new Date(val);
    if (!isNaN(d)) return Math.round((d - new Date('1899-12-30T00:00:00Z')) / 86400000);
    return null;
  }
  return null;
}

function serialToDateStr(s) {
  if (!s || isNaN(s)) return '';
  const d = new Date((s - 25569) * 86400000);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
}

// Like toSerial, but for the Remark column. A free-text remark that merely CONTAINS
// a date fragment (e.g. "FTL 28 Jun Appt") must be kept verbatim, not coerced to a date.
// Only true Excel serials and clean date strings convert; anything with stray words stays text.
function remarkToSerial(val) {
  if (typeof val === 'number') return Math.round(val);
  if (typeof val === 'string') {
    const t = val.trim();
    if (t === '') return null;
    if (/^\d+(\.\d+)?$/.test(t)) return Math.round(parseFloat(t));   // Excel serial number
    // Remove month names, then if any letters remain it's free-text → keep as-is.
    const stripped = t.replace(/jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec/gi, '');
    if (/[a-z]/i.test(stripped)) return null;
    return toSerial(t);   // looks like a clean date → use the normal parser
  }
  return null;
}

const nor = s => String(s||'').trim().toLowerCase();

// Display helper: render CFA origins without parentheses for the
// Expected Source / CFA Serviceability Check columns only.
// "CFA (GGN)" -> "CFA GGN", "CFA (BLR)" -> "CFA BLR". Other values pass through.
const cfaLabelNorm = s => String(s ?? '').replace(/CFA\s*\(\s*(GGN|BLR)\s*\)/gi, 'CFA $1');
const fc = (obj,...names) => { for(const n of names){ const f=Object.keys(obj).find(k=>nor(k)===nor(n)); if(f)return f; } return names[0]; };

      const stateOk = origin === 'CFA (GGN)'
        ? CFA_SHIPPING_STATES.has(nor(shipState))
        : CFA_BLR_STATES.has(nor(shipState));
      reaValidation = (itemOk && stateOk) ? 'TRUE' : 'FALSE';
      if (!itemOk && !stateOk)  reaFalseReason = 'Item & state';
      else if (!itemOk)         reaFalseReason = 'Item not listed';
      else if (!stateOk)        reaFalseReason = 'Wrong state';
    } else if (expectedOrigin !== undefined) {
      reaValidation = (nor(origin) === nor(expectedOrigin)) ? 'TRUE' : 'FALSE';
      if (reaValidation === 'FALSE') reaFalseReason = 'Expected ' + expectedOrigin;
    }

    /* ── CFA serviceability ────────────────────────────────────────────
       Single source of truth for the three CFA columns below: the row is
       CFA-serviceable when its Item_Code is in the common CFA list AND its
       Shipping State is served by one of the CFAs. Applies to ALL
       customer groups. */
    const cfaArea = CFA_COMMON_ITEM_CODES.has(nor(itemCode))
      ? CFA_SERVICE_AREAS.find(a => a.states.has(nor(shipState)))
      : null;

    /* CONDITION 29 (REVISED): Is CFA = Yes when the row is CFA-serviceable
       (was previously based on whether Origin started with "CFA"). */
    const isCfaFlag = cfaArea ? 'Yes' : 'No';

    /* Item-derived source, shared by the CPC KPKB/CSD branch and the
       default branch below:
         Item_Group Makhana                                      -> Purnea
         Munchies + parent Makhana Munchies                      -> UD Foods
         Munchies + parent Munchies Waves / Munchies Waves-Airlines -> Rebela
         anything else                                           -> Indore */
    const itemDerivedSource = () => {
      if (nor(itemGroup) === 'makhana') return 'Purnea';
      if (nor(itemGroup) === 'munchies') {
        const p = nor(itemParentVal);
        if (p === 'makhana munchies') return 'UD Foods';
        if (p === 'munchies waves' || p === 'munchies waves-airlines') return 'Rebela';
      }
      return 'Indore';
    };

    /* CONDITION 31 (REVISED): Expected Source
         CPC KPKB / CSD          -> item-derived, CFA logic ignored entirely
         E-Commerce / Quick Commerce -> the Origin as-is (Branch governs it)
         else CFA-serviceable    -> the serving CFA
         else                    -> item-derived */
    let expectedSource;
    if (CPC_CSD_GROUPS.has(nor(custGroup))) {
      expectedSource = itemDerivedSource();
    } else if (ECOM_QC_GROUPS.has(nor(custGroup))) {
      expectedSource = cfaLabelNorm(origin);
    } else if (cfaArea) {
      expectedSource = cfaArea.label;
    } else {
      expectedSource = itemDerivedSource();
    }

    /* CONDITION 30: CFA Serviceability Check = the two combined. */
    const cfaServiceability = cfaArea ? `Yes, ${cfaArea.label}` : `No, ${cfaLabelNorm(origin)}`;

    /* CONDITION 32 (REVISED): Order Corrected Remark — tags the order with
       the CFA that could dispatch it (per the SKU + shipping-state logic).
       When no CFA applies it falls back to the item-derived source instead
       of being left blank, for ALL customer groups. */
    const orderCorrectedRemark = cfaArea ? cfaArea.label : itemDerivedSource();

    /* CONDITION 33 (REVISED): Source Check — three-way agreement between
       Expected Source, the Origin, and Order Corrected Remark (the
       branch-aware corrected source). TRUE only when all three match.
       Compared canonically so the two CFA spellings ("CFA (GGN)" from
       Origin vs "CFA GGN") count as equal. */
    const canonSource = s => nor(s).replace(/[()]/g, '').replace(/\s+/g, ' ').trim();
    const sourceCheck = (canonSource(expectedSource) === canonSource(origin)
                      && canonSource(expectedSource) === canonSource(orderCorrectedRemark))
      ? 'TRUE' : 'FALSE';

    /* CONDITION 10: If Dispatched, then EDD = Remark + Day */
    const remarkSerial = remarkToSerial(remarkRaw);
    let dispEDDSerial = null;
    if (remarkSerial !== null && day >= 0) {
      dispEDDSerial = remarkSerial + day;
    }

    /* CONDITION 12 + 13: EDD (integer — difference of two date serials) */
    let edd = '';
    if (dispEDDSerial !== null) {
      if (isFK && apptSerial !== null)  edd = Math.round(dispEDDSerial - apptSerial);
      else if (poExpirySerial !== null) edd = Math.round(dispEDDSerial - poExpirySerial);
      else                              edd = Math.round(dispEDDSerial);
    }

    /* CONDITION 15 (REPURPOSED): Priority = short reason when Rea is FALSE,
       empty otherwise. (The old P1/P2 logic remains cancelled.) */
    const priority = reaFalseReason;

    /* CONDITION 16: Red highlight */
    const isRed = typeof edd==='number' && edd > 1;

    /* CONDITION 17: Merge */
    const merge = soNo + String(row[COL.Branch]||'');

    const fmtD = s => s ? serialToDateStr(s) : '';
    const fmtRemark = () => {
      if (remarkRaw==='') return '';
      if (remarkSerial!==null) return fmtD(remarkSerial);
      return typeof remarkRaw==='string' ? remarkRaw : '';
    };

    result.push({
      /* ─ internal raw values for export ─ */
      _red: isRed,
      _remarkSerial: remarkSerial,
      _remarkRaw: remarkRaw,
      _dispEDDSerial: dispEDDSerial,
      _apptSerial: apptSerial,
      _apptText: apptText,
      _poExpirySerial: poExpirySerial,
      _soDateSerial: soDateSerial,
      /* ─ output columns (all display-formatted) ─ */
      CC: cc,
      Sales_Order_No: soNo,
      'SO Check': row['SO Check']||'',
      Picklist: row['Picklist']||'',
      Sales_Order_Date: soDateSerial ? fmtD(soDateSerial) : String(row[COL.SoDate]||''),
      Po_No: row[COL.PoNo]||'',
      po_expiry_date: poExpirySerial ? fmtD(poExpirySerial) : String(row[COL.PoExpiry]||''),
      customer_group: custGroup,
      Appt: apptSerial ? fmtD(apptSerial) : (apptText || ''),
      Remark: fmtRemark(),
      Rea: reaValidation,
      Priority: priority,
      'Final Dispatch Status': finalDisp,
      'If Dispatched, then EDD': dispEDDSerial ? fmtD(dispEDDSerial) : '',
      EDD: (typeof edd==='number') ? edd : '',
      'Origin Kgs': row[COL.OriginKgs]||pendKgs,
      client_type: clientType,
      Customer: customerVal,
      Item_Name: itemName,
      'Pending Qty': row[COL.PendQty]||'',
      'Pending Kgs': pendKgs,
      Boxes: row['Boxes']||'',
      TPT: row['TPT']||'',
      Origin: origin,  /* may be overridden to CFA (GGN) / CFA (BLR) */
      Shipping_Address_Name: row['Shipping_Address_Name']||'',
      item_parent: row['item_parent']||'',
      'Case Size': row['Case Size']||'',
      'Shipping State': shipState,
      Day: day||'',
      Item_Group: row['Item_Group']||'',
      Item_Code: itemCode,
      Item_Type: row['Item_Type']||'',
      conversion_factor: row['conversion_factor']||'',
      Stock_qty: row['Stock_qty']||'',
      Qty: row['Qty']||'',
      'Selling Rate': row['Selling Rate']||'',
      MRP: row['MRP']||'',
      'TAX Rate': row['TAX Rate']||row['TAX_Rate']||'',
      'Selling Rate Per Kg': row['Selling Rate Per Kg']||'',
      Amount: row['Amount']||'',
      'Tax Amount': row['Tax Amount']||'',
      'Final Amount': row['Final Amount']||'',
      Delivered_Qty: (row['Delivered_Qty'] === undefined || row['Delivered_Qty'] === null || String(row['Delivered_Qty']).trim() === '') ? 0 : row['Delivered_Qty'],
      returned_qty: retQty,
      'Shipping Address Details': row['Shipping Address Details']||'',
      'Shipping Pincode': row['Shipping Pincode']||'',
      'Billing Address Details': row['Billing Address Details']||'',
      'Complete Shipping Address': row['Complete Shipping Address']||'',
      'New MIS ITEM Group': row['New MIS ITEM Group']||'',
      Branch: row[COL.Branch]||'',
      Dispatch_Status: dispStatus,
      Origin_Indore_Status: iStatus,
      Origin_Purnea_Status: pStatus,
      Origin_UD_Foods_Status: uStatus,
      'DATE(tso.sales_order_confirmation_date)': row['DATE(tso.sales_order_confirmation_date)']||'',
      owner: row['owner']||'',
      Workflow_State: row['Workflow_State']||'',
      purpose: row['purpose']||'',
      Sales_Order_Status: row['Sales_Order_Status']||'',
      Delivery_Date: row['Delivery_Date']||'',
      'Multi GRN': row['Multi GRN']||'',
      Merge: merge,
      'CFA Check': row['CFA Check']||'',
      'Is CFA': isCfaFlag,
      'Expected Source': expectedSource,
      'CFA Serviceability Check': cfaServiceability,
      'Order Corrected Remark': orderCorrectedRemark,
      'Source Check': sourceCheck,
    });
  });

  outputRows = result;
  const cfaGurgaonCount = result.filter(r => r.Origin === 'CFA (GGN)').length;
  const cfaBangaloreCount = result.filter(r => r.Origin === 'CFA (BLR)').length;
  const fkRows = result.filter(r => ['fk-grocery-vs48860','fk-hyperlocal-vs46867','fk-alpha-vs46867'].includes(nor(r.client_type)));
  const fkWithAppt = fkRows.filter(r => r.Appt && r.Appt !== '').length;
  log(`Rows kept: ${kept} | Rows skipped: ${skipped} | CFA Gurgaon: ${cfaGurgaonCount} | CFA Bangalore: ${cfaBangaloreCount}`,'ok');
  log(`FK rows: ${fkRows.length} total | ${fkWithAppt} with Appt matched | ${fkRows.length - fkWithAppt} without Appt`,'info');

  renderTable(result);
  const redCount = result.filter(r=>r._red).length;
  document.getElementById('previewMeta').textContent =
    `${result.length} rows · ${redCount} red · ${new Date().toLocaleString()}`;
  document.getElementById('preview').classList.add('visible');
  document.getElementById('exportBtn').style.display='inline-block';
  log(`✓ Done — ${result.length} rows generated`,'ok');
}

/* ═══════════════════════════════════════════════════════════════════════════
   PIVOT SOURCE TAB — a clean flat data range with just the fields needed
   for the 5 reference pivots. SheetJS (this app's Excel library) can only
   READ pivot table XML, not write it, so real interactive PivotTables
   can't be embedded automatically. This sheet is deliberately a plain,
   contiguous table so Insert → PivotTable in Excel works immediately on
   the whole range, with real filters, drag-and-drop and refresh.
═══════════════════════════════════════════════════════════════════════════ */
function buildPivotSourceSheet(rows) {
  const cols = ['Source Check','customer_group','Priority','Order Corrected Remark',
                'Shipping State','Sales_Order_Date','New MIS ITEM Group','Pending Kgs'];
  const data = rows.map(r => ({
    'Source Check': r['Source Check'] || '',
    customer_group: r.customer_group || '',
    Priority: r.Priority || '',
    'Order Corrected Remark': r['Order Corrected Remark'] || '',
    'Shipping State': r['Shipping State'] || '',
    Sales_Order_Date: r._soDateSerial || '',
    'New MIS ITEM Group': r['New MIS ITEM Group'] || '',
    'Pending Kgs': parseFloat(r['Pending Kgs']) || 0,
  }));
  const wsP = XLSX.utils.json_to_sheet(data, { header: cols });
  const dateCol = cols.indexOf('Sales_Order_Date');
  const range = XLSX.utils.decode_range(wsP['!ref'] || 'A1');
  for (let R = range.s.r + 1; R <= range.e.r; R++) {
    const addr = XLSX.utils.encode_cell({ r: R, c: dateCol });
    if (wsP[addr] && typeof wsP[addr].v === 'number') { wsP[addr].t = 'n'; wsP[addr].z = 'YYYY-MM-DD'; }
  }
  wsP['!cols'] = cols.map(h => ({ wch: Math.min(Math.max(h.length + 2, 12), 28) }));
  // Real AutoFilter on the full, unfiltered data — this is where genuine
  // filter dropdowns for Source Check / customer_group (and every other
  // column) actually work, since Excel needs the full range of values
  // present to offer as filter options. The 5 Pivot sheets are already
  // pre-aggregated to one filter combination, so there's nothing left to
  // filter there — this is the sheet to filter on.
  wsP['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: data.length, c: cols.length - 1 } }) };
  return wsP;
}

/* ═══════════════════════════════════════════════════════════════════════════
   PIVOT SHEETS — one sheet per pivot, each with a REAL working AutoFilter
   (verified: SheetJS round-trips '!autofilter' correctly) so the sales team
   gets genuine filter dropdowns on every column. These are still static
   cross-tabs, not live Excel PivotTables — SheetJS community edition cannot
   write pivot-cache/pivot-table XML, and cell fill/bold-font writing was
   also verified NOT to round-trip in this build (readback always came back
   patternType:'none'), so "color coding" here uses colored emoji glyphs
   instead of cell background colors — these render in actual color in
   Excel because they're glyphs, not styling, so they aren't affected by
   that limitation. 🟢 = item/state qualifies for a CFA but isn't routed
   there; 🟠 = origin conflicts with the item-group/parent routing rule;
   🔴 = the underlying Rea validation failed outright (see Priority).
═══════════════════════════════════════════════════════════════════════════ */
function buildOnePivotSheet(title, filterNote, data, rowLevels, rowLabels, rowPartsFn, colLevels, colPartsFn, sortRowFn) {
  const ws = {};
  const merges = [];
  let curRow = 0;
  let maxCol = 0;
  const round3 = v => Math.round(v * 1000) / 1000;

  function setCell(r, c, val, isNum) {
    const addr = XLSX.utils.encode_cell({ r, c });
    ws[addr] = isNum ? { t: 'n', v: val, z: '#,##0.00' } : { t: 's', v: String(val) };
    if (c > maxCol) maxCol = c;
  }

  setCell(curRow, 0, title); curRow++;
  if (filterNote) { setCell(curRow, 0, filterNote); curRow++; }
  setCell(curRow, 0, '🟢 route to CFA   🟠 item-group mismatch   🔴 validation failure (see Priority)'); curRow++;
  curRow++;

  if (!data.length) {
    setCell(curRow, 0, '(no matching rows)');
    ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: curRow, c: Math.max(maxCol, 0) } });
    return ws;
  }

    const rowMap = new Map();
  const colSeen = new Map();
  data.forEach(row => {
    const rParts = rowPartsFn(row).map(x => (x === '' || x == null) ? '(blank)' : String(x));
    const rKey = rParts.join('');
    const cParts = colLevels === 0 ? ['Sum of Pending Kgs'] : colPartsFn(row).map(x => (x === '' || x == null) ? '(blank)' : String(x));
    const cKey = cParts.join('');
    colSeen.set(cKey, cParts);
    if (!rowMap.has(rKey)) rowMap.set(rKey, { parts: rParts, cols: new Map(), total: 0, sortVal: sortRowFn ? sortRowFn(row) : null });
    const e = rowMap.get(rKey);
    const v = parseFloat(row['Pending Kgs']) || 0;
    e.cols.set(cKey, (e.cols.get(cKey) || 0) + v);
    e.total += v;
  });

  const rowEntries = Array.from(rowMap.values()).sort((a, b) => {
    if (a.sortVal != null && b.sortVal != null && a.sortVal !== b.sortVal) return a.sortVal - b.sortVal;
    return a.parts.join('').localeCompare(b.parts.join(''));
  });
  const colEntries = Array.from(colSeen.entries()).sort((a, b) => a[0].localeCompare(b[0]));

  const headerStartRow = curRow;
  const headerRows = colLevels === 2 ? 2 : 1;
  let filterEndCol;

  if (colLevels === 0) {
    setCell(headerStartRow, rowLevels, 'Sum of Pending Kgs');
    filterEndCol = rowLevels;
  } else if (colLevels === 2) {
    let c = rowLevels, i = 0;
    while (i < colEntries.length) {
      const parts = colEntries[i][1]; const lvl1 = parts[0];
      let span = 0; while (i + span < colEntries.length && colEntries[i + span][1][0] === lvl1) span++;
      setCell(headerStartRow, c, lvl1);
      if (span > 1) merges.push({ s: { r: headerStartRow, c }, e: { r: headerStartRow, c: c + span - 1 } });
      for (let k = 0; k < span; k++) setCell(headerStartRow + 1, c + k, colEntries[i + k][1][1]);
      c += span; i += span;
    }
    setCell(headerStartRow, c, 'Grand Total');
    merges.push({ s: { r: headerStartRow, c }, e: { r: headerStartRow + 1, c } });
    filterEndCol = c;
  } else {
    colEntries.forEach((ce, idx) => setCell(headerStartRow, rowLevels + idx, ce[1][0]));
    setCell(headerStartRow, rowLevels + colEntries.length, 'Grand Total');
    filterEndCol = rowLevels + colEntries.length;
  }

  const lastHeaderRow = headerStartRow + headerRows - 1;
  rowLabels.forEach((lbl, idx) => setCell(lastHeaderRow, idx, lbl));
  curRow = headerStartRow + headerRows;
  const dataStartRow = curRow;

  if (colLevels === 0) {
    let grand = 0;
    rowEntries.forEach(entry => {
      entry.parts.forEach((p, idx) => setCell(curRow, idx, p));
      setCell(curRow, rowLevels, round3(entry.total), true);
      grand += entry.total;
      curRow++;
    });
    const dataEndRow = curRow - 1;
    setCell(curRow, 0, 'Grand Total');
    setCell(curRow, rowLevels, round3(grand), true);
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: dataStartRow - 1, c: 0 }, e: { r: dataEndRow, c: filterEndCol } }) };
  } else {
    const colTotals = new Array(colEntries.length).fill(0);
    let grand = 0;
    rowEntries.forEach(entry => {
      entry.parts.forEach((p, idx) => setCell(curRow, idx, p));
      colEntries.forEach((ce, idx) => {
        const v = entry.cols.get(ce[0]) || 0;
        setCell(curRow, rowLevels + idx, round3(v), true);
        colTotals[idx] += v;
      });
      setCell(curRow, rowLevels + colEntries.length, round3(entry.total), true);
      grand += entry.total;
      curRow++;
    });
    const dataEndRow = curRow - 1;
    setCell(curRow, 0, 'Grand Total');
    colEntries.forEach((ce, idx) => setCell(curRow, rowLevels + idx, round3(colTotals[idx]), true));
    setCell(curRow, rowLevels + colEntries.length, round3(grand), true);
    ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: lastHeaderRow, c: 0 }, e: { r: dataEndRow, c: filterEndCol } }) };
  }

  ws['!merges'] = merges;
  ws['!ref'] = XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: curRow, c: maxCol } });
  ws['!cols'] = new Array(rowLevels).fill({ wch: 30 }).concat(new Array(Math.max(0, maxCol - rowLevels + 1)).fill({ wch: 14 }));
  return ws;
}

function buildAllPivotSheets(rows) {
  const isoFromSerial = s => { if (!s || isNaN(s)) return ''; const d = new Date((s - 25569) * 86400000); return d.toISOString().slice(0, 10); };

  // Promote a blank Priority to the CFA tag when Order Corrected Remark is a
  // CFA label, so "route to a CFA" shows up as its own top-level group
  // instead of being buried under "(blank)". Then tag with a colored emoji
  // so the sales team can triage at a glance without needing cell colors.
  const priorityForPivot = r => {
    const p = r.Priority || '';
    if (p) return p;
    const ocr = r['Order Corrected Remark'] || '';
    return (ocr === 'CFA GGN' || ocr === 'CFA BLR') ? ocr : '';
  };
  const markLabel = label => {
    if (label === 'CFA GGN' || label === 'CFA BLR') return '🟢 ' + label;
    if (typeof label === 'string' && label.indexOf('Expected ') === 0) return '🟠 ' + label;
    if (label === 'Item not listed' || label === 'Wrong state' || label === 'Item & state') return '🔴 ' + label;
    return label;
  };
  const priorityOf = r => markLabel(priorityForPivot(r));
  const ocrOf = r => r['Order Corrected Remark'] || '';

  const qcFalse = rows.filter(r => r['Source Check'] === 'FALSE' && nor(r.customer_group) === 'quick commerce');
  const allFalse = rows.filter(r => r['Source Check'] === 'FALSE');

  const sheets = {};

  sheets['Pivot 1'] = buildOnePivotSheet(
    'Pivot 1 - Priority x Order Corrected Remark by Shipping State',
    'Filters: Source Check = FALSE, customer_group = Quick Commerce | Values: Sum of Pending Kgs',
    qcFalse, 2, ['Priority', 'Order Corrected Remark'], r => [priorityOf(r), ocrOf(r)],
    1, r => [r['Shipping State']]);

  sheets['Pivot 2'] = buildOnePivotSheet(
    'Pivot 2 - Pending Kgs by Sales Order Date',
    'Filters: Source Check = FALSE, customer_group = Quick Commerce | Values: Sum of Pending Kgs',
    qcFalse, 1, ['Sales Order Date'], r => [r._soDateSerial ? isoFromSerial(r._soDateSerial) : ''],
    0, null, r => r._soDateSerial || Infinity);

  sheets['Pivot 3'] = buildOnePivotSheet(
    'Pivot 3 - Sales Order Date x Priority / Order Corrected Remark',
    'Filters: Source Check = FALSE, customer_group = Quick Commerce | Values: Sum of Pending Kgs',
    qcFalse, 1, ['Sales Order Date'], r => [r._soDateSerial ? isoFromSerial(r._soDateSerial) : ''],
    2, r => [priorityOf(r), ocrOf(r)], r => r._soDateSerial || Infinity);

  sheets['Pivot 4'] = buildOnePivotSheet(
    'Pivot 4 - customer_group x Priority / Order Corrected Remark',
    'Filter: Source Check = FALSE | Values: Sum of Pending Kgs',
    allFalse, 1, ['Customer Group'], r => [r.customer_group],
    2, r => [priorityOf(r), ocrOf(r)]);

  sheets['Pivot 5'] = buildOnePivotSheet(
    'Pivot 5 - New MIS ITEM Group x Priority / Order Corrected Remark',
    'Filter: Source Check = FALSE | Values: Sum of Pending Kgs',
    allFalse, 1, ['New MIS ITEM Group'], r => [r['New MIS ITEM Group']],
    2, r => [priorityOf(r), ocrOf(r)]);

  return sheets;
}

function exportToExcel() {
  if (!outputRows.length) return;

  /* ── Column index map (0-based) for formula references ─────────────── */
  const colIdx = {};
  EXPORT_COLS.forEach((h, i) => { colIdx[h] = i; });
  const colLetter = idx => {
    let s = '';
    idx++;
    while (idx > 0) { idx--; s = String.fromCharCode(65 + (idx % 26)) + s; idx = Math.floor(idx / 26); }
    return s;
  };
  const C = name => colLetter(colIdx[name]);

  /* ── Build reference sheets ────────────────────────────────────────── */
  // LEAD TIME sheet: Origin | Shipping State | Day | Lookup_Key (helper)
  const ltExport = refData.leadtime.map(r => {
    const orig = String(r.Origin||r.origin||'').trim();
    const state = String(r['Shipping State']||r.Shipping_State||r['shipping state']||'').trim();
    const day = parseInt(r.Day||r.day)||0;
    return { Origin: orig, 'Shipping State': state, Day: day, Lookup_Key: orig.toLowerCase()+'||'+state.toLowerCase() };
  });
  const wsLT = XLSX.utils.json_to_sheet(ltExport, {header:['Origin','Shipping State','Day','Lookup_Key']});

  // Appointments sheet: PO_No | Appt_Date (use best PO column for reference sheet)
  const apptExport = [];
  if (refData.appointments.length > 0) {
    const s0 = refData.appointments[0];
    const allPoKeys = Object.keys(s0).filter(k =>
      /po.?no/i.test(String(k)) || /s0.?no/i.test(String(k)) || /so.?no/i.test(String(k)) || /new\s*so/i.test(String(k))
    );
    ['Po_No','PO-No','PO No','po_no','S0- No.','New SO-14','Sales_Order_No'].forEach(n => {
      if (s0[n] !== undefined && !allPoKeys.includes(n)) allPoKeys.push(n);
    });
    const dtKey = Object.keys(s0).find(k => /appt.?date/i.test(String(k))) || 'Appt date';
    refData.appointments.forEach(r => {
      // Pick first non-empty PO value
      let po = '';
      for (const pk of allPoKeys) {
        const v = String(r[pk]||'').trim();
        if (v) { po = v; break; }
      }
      const rawVal = r[dtKey];
      if (!po || rawVal===null || rawVal===undefined || String(rawVal).trim()==='') return;
      const rawStr = String(rawVal).trim();
      const hasMulti = rawStr.includes(',');
      if (hasMulti) {
        apptExport.push({ PO_No: po, Appt_Date: rawStr }); // multi-date text as-is
      } else {
        const dt = toSerial(rawVal);
        if (dt) apptExport.push({ PO_No: po, Appt_Date: dt });
      }
    });
  }
  const wsAppt = XLSX.utils.json_to_sheet(apptExport, {header:['PO_No','Appt_Date']});
  // Format Appt_Date as date
  if (apptExport.length > 0) {
    for (let R=1; R<=apptExport.length; R++) {
      const addr = XLSX.utils.encode_cell({r:R, c:1});
      if (wsAppt[addr] && typeof wsAppt[addr].v==='number') { wsAppt[addr].z='YYYY-MM-DD'; }
    }
  }

  // Yesterday sheet: CC | Remark
  const yestExport = [];
  if (refData.yesterday.length > 0) {
    const ys = refData.yesterday[0];
    const yCC = fc(ys, 'CC', 'cc', 'DF:CC');
    const yRemark = fc(ys, 'Remark', 'Remarks', 'remark', 'remarks');
    const ySoNo = fc(ys, 'Sales_Order_No', 'Sales Order No', 'sales_order_no');
    const yItemCode = fc(ys, 'Item_Code', 'Item Code', 'item_code');
    refData.yesterday.forEach(r => {
      let ccVal = String(r[yCC]||r['DF:CC']||r['CC']||r['cc']||'').trim();
      let rem = r[yRemark]; if(rem===undefined) rem=r['Remarks']||r['Remark']||r['remark']||'';
      // Also build CC from SO+ItemCode if CC is missing
      if (!ccVal || ccVal.startsWith('#')) {
        const so = String(r[ySoNo]||r['Sales_Order_No']||'').trim();
        const ic = String(r[yItemCode]||r['Item_Code']||'').trim();
        ccVal = so+ic;
      }
      if (ccVal) {
        const remarkSerial = remarkToSerial(rem);
        yestExport.push({ CC: ccVal.toLowerCase(), Remark: remarkSerial!==null ? remarkSerial : (rem||'') });
      }
    });
  }
  const wsYest = XLSX.utils.json_to_sheet(yestExport, {header:['CC','Remark']});

  /* ── Build main sheet with formulas ────────────────────────────────── */
  // First row: write raw values for non-formula columns, placeholders for formula columns
  const FORMULA_COLS = new Set(['CC','Day','Appt','Remark','If Dispatched, then EDD','EDD','Merge','Dispatch_Status','Final Dispatch Status']);

  const exportData = outputRows.map(row => {
    const obj = {};
    EXPORT_COLS.forEach(h => {
      if (FORMULA_COLS.has(h)) {
        obj[h] = ''; // placeholder — will be overwritten with formula
      } else if (h==='Sales_Order_Date')  obj[h] = row._soDateSerial || '';
      else if (h==='po_expiry_date')      obj[h] = row._poExpirySerial || '';
      else if (h==='Delivery_Date' || h==='DATE(tso.sales_order_confirmation_date)') {
        const serial = toSerial(row[h]); obj[h] = serial!==null ? serial : (row[h]||'');
      } else if (NUMERIC_COLS.has(h)) {
        const val = row[h];
        if (val===''||val===null||val===undefined) obj[h]='';
        else if (typeof val==='number') obj[h]=val;
        else { const n=parseFloat(val); obj[h]=(!isNaN(n)?n:val); }
      } else obj[h] = row[h] ?? '';
    });
    return obj;
  });

  const ws = XLSX.utils.json_to_sheet(exportData, {header: EXPORT_COLS});

  /* ── Inject Excel formulas into computed columns ───────────────────── */
  const totalRows = outputRows.length;
  const ltRows = ltExport.length;
  const apptRows = apptExport.length;
  const yestRows = yestExport.length;

  for (let i = 0; i < totalRows; i++) {
    const r = i + 2; // Excel row (1-indexed, row 1 = header)

    // CC = Sales_Order_No & Item_Code (Condition 4)
    const ccAddr = XLSX.utils.encode_cell({r:r-1, c:colIdx['CC']});
    ws[ccAddr] = { t:'s', f:`${C('Sales_Order_No')}${r}&${C('Item_Code')}${r}` };

    // Day = INDEX-MATCH from LEAD TIME using LOWER(Origin)||LOWER(Shipping State) (Condition 5)
    const dayAddr = XLSX.utils.encode_cell({r:r-1, c:colIdx['Day']});
    ws[dayAddr] = { t:'n', f:`IFERROR(INDEX('LEAD TIME'!C$2:C$${ltRows+1},MATCH(LOWER(${C('Origin')}${r})&"||"&LOWER(${C('Shipping State')}${r}),'LEAD TIME'!D$2:D$${ltRows+1},0)),0)` };

    // Appt (Condition 6): FK types → VLOOKUP on Po_No; "Now" → Sales_Order_Date+7
    const apptAddr = XLSX.utils.encode_cell({r:r-1, c:colIdx['Appt']});
    ws[apptAddr] = { t:'n', f:`IF(OR(${C('client_type')}${r}="FK-Grocery-VS48860",${C('client_type')}${r}="FK-Hyperlocal-VS46867",${C('client_type')}${r}="FK-Alpha-VS46867"),IFERROR(VLOOKUP(${C('Po_No')}${r},Appointments!A$2:B$${apptRows+1},2,FALSE),""),IF(LOWER(${C('client_type')}${r})="now",IF(ISNUMBER(${C('Sales_Order_Date')}${r}),${C('Sales_Order_Date')}${r}+7,""),""))`, z:'YYYY-MM-DD' };

    // Remark (Condition 7): VLOOKUP from Yesterday on CC match
    // Condition 21 override: closed if PendKgs < OriginKgs AND >0 AND (Modern Trade/Quick Commerce) AND Avenue E-Commerce
    const remAddr = XLSX.utils.encode_cell({r:r-1, c:colIdx['Remark']});
    ws[remAddr] = { t:'s', f:`IFERROR(VLOOKUP(LOWER(${C('CC')}${r}),Yesterday!A$2:B$${yestRows+1},2,FALSE),"")` };

    // Rea is a plain computed TRUE/FALSE origin-validation value — no formula.

    // If Dispatched, then EDD = Remark + Day (Condition 10)
    const eddDispAddr = XLSX.utils.encode_cell({r:r-1, c:colIdx['If Dispatched, then EDD']});
    ws[eddDispAddr] = { t:'n', f:`IF(ISNUMBER(${C('Remark')}${r}),${C('Remark')}${r}+${C('Day')}${r},"")`, z:'YYYY-MM-DD' };

    // EDD (Conditions 12-14): FK → IfDispEDD-Appt; Others → IfDispEDD-po_expiry; fallback → IfDispEDD
    const eddAddr = XLSX.utils.encode_cell({r:r-1, c:colIdx['EDD']});
    ws[eddAddr] = { t:'n', f:`IF(ISNUMBER(${C('If Dispatched, then EDD')}${r}),IF(OR(${C('client_type')}${r}="FK-Grocery-VS48860",${C('client_type')}${r}="FK-Hyperlocal-VS46867",${C('client_type')}${r}="FK-Alpha-VS46867"),IF(ISNUMBER(${C('Appt')}${r}),${C('If Dispatched, then EDD')}${r}-${C('Appt')}${r},${C('If Dispatched, then EDD')}${r}),IF(ISNUMBER(${C('po_expiry_date')}${r}),${C('If Dispatched, then EDD')}${r}-${C('po_expiry_date')}${r},${C('If Dispatched, then EDD')}${r})),"")`, z:'0' };

    // Priority (Condition 15 cancelled): column intentionally left blank — no formula.

    // Final Dispatch Status (Condition 3/18)
    const fdAddr = XLSX.utils.encode_cell({r:r-1, c:colIdx['Final Dispatch Status']});
    ws[fdAddr] = { t:'s', f:`IF(OR(ISNUMBER(SEARCH("Partial Dispatch",${C('Origin_Indore_Status')}${r})),ISNUMBER(SEARCH("Partial Dispatch",${C('Origin_Purnea_Status')}${r})),ISNUMBER(SEARCH("Partial Dispatch",${C('Origin_UD_Foods_Status')}${r}))),"Partial Dispatch",IF(OR(ISNUMBER(SEARCH("Pending",${C('Origin_Indore_Status')}${r})),ISNUMBER(SEARCH("Pending",${C('Origin_Purnea_Status')}${r})),ISNUMBER(SEARCH("Pending",${C('Origin_UD_Foods_Status')}${r}))),"Pending",""))` };

    // Dispatch_Status (same logic as Final Dispatch Status)
    const dsAddr = XLSX.utils.encode_cell({r:r-1, c:colIdx['Dispatch_Status']});
    ws[dsAddr] = { t:'s', f:`IF(OR(ISNUMBER(SEARCH("Partial Dispatch",${C('Origin_Indore_Status')}${r})),ISNUMBER(SEARCH("Partial Dispatch",${C('Origin_Purnea_Status')}${r})),ISNUMBER(SEARCH("Partial Dispatch",${C('Origin_UD_Foods_Status')}${r}))),"Partial Dispatch",IF(OR(ISNUMBER(SEARCH("Pending",${C('Origin_Indore_Status')}${r})),ISNUMBER(SEARCH("Pending",${C('Origin_Purnea_Status')}${r})),ISNUMBER(SEARCH("Pending",${C('Origin_UD_Foods_Status')}${r}))),"Pending",""))` };

    // Merge = Sales_Order_No & Branch (Condition 17)
    const mgAddr = XLSX.utils.encode_cell({r:r-1, c:colIdx['Merge']});
    ws[mgAddr] = { t:'s', f:`${C('Sales_Order_No')}${r}&${C('Branch')}${r}` };
  }

  /* ── Apply number formats to date and numeric columns ──────────────── */
  const range = XLSX.utils.decode_range(ws['!ref'] || 'A1');
  for (let R = range.s.r+1; R <= range.e.r; R++) {
    EXPORT_COLS.forEach((h, ci) => {
      const addr = XLSX.utils.encode_cell({r:R, c:ci});
      if (!ws[addr]) return;
      if (FORMULA_COLS.has(h)) return; // already handled
      if (DATE_COLS.has(h) && typeof ws[addr].v === 'number') {
        ws[addr].t = 'n'; ws[addr].z = 'YYYY-MM-DD';
      } else if (NUMERIC_COLS.has(h) && typeof ws[addr].v === 'number') {
        ws[addr].t = 'n';
      }
    });
  }

  // Set column widths
  ws['!cols'] = EXPORT_COLS.map(h => ({wch: Math.min(Math.max(h.length+2, 10), 30)}));

  /* ── Assemble workbook with all sheets ─────────────────────────────── */
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Dispatch plan_Today');
  XLSX.utils.book_append_sheet(wb, wsLT, 'LEAD TIME');
  XLSX.utils.book_append_sheet(wb, wsAppt, 'Appointments');
  XLSX.utils.book_append_sheet(wb, wsYest, 'Yesterday');
  const wsPivotSrc = buildPivotSourceSheet(outputRows);
  XLSX.utils.book_append_sheet(wb, wsPivotSrc, 'Pivot Source');
  const pivotSheets = buildAllPivotSheets(outputRows);
  Object.keys(pivotSheets).forEach(name => XLSX.utils.book_append_sheet(wb, pivotSheets[name], name));
  XLSX.writeFile(wb, 'Dispatch_Plan_Today_'+new Date().toISOString().slice(0,10)+'.xlsx');
  log('✓ Excel exported with formulas + reference sheets (LEAD TIME, Appointments, Yesterday, Pivot Source, Pivot 1-5)','ok');
}
